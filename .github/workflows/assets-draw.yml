name: Assets

# Re-run draw.jl when logo/social sources change. Fails if committed SVGs drift.
# PNG is local (`draw.jl --png`); not compared across OS.

on:
  push:
    branches:
      - main
    paths:
      - "docs/src/assets/**"
      - ".github/workflows/assets-draw.yml"
  pull_request:
    paths:
      - "docs/src/assets/**"
      - ".github/workflows/assets-draw.yml"
  workflow_dispatch:

concurrency:
  group: assets-draw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  draw:
    name: draw SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/julia-slot
        with:
          slot: min
      - name: Instantiate pinned Luxor
        run: julia --project=docs/src/assets/logo -e 'using Pkg; Pkg.instantiate()'
      - name: Draw SVG derivatives
        run: julia --project=docs/src/assets/logo docs/src/assets/logo/draw.jl
      - name: Check committed SVG assets match draw
        run: |
          if ! git diff --exit-code -- docs/src/assets/; then
            echo "::error::docs/src/assets/ is out of date. Run: julia --project=docs/src/assets/logo docs/src/assets/logo/draw.jl (and --png if rasters changed), then commit."
            exit 1
          fi
      - name: Warn if PNG look stale vs sources
        working-directory: docs/src/assets
        run: |
          set -euo pipefail
          commit_ts() {
            git log -1 --format=%ct -- "$1" 2>/dev/null || echo 0
          }
          warn_if_stale() {
            local raster="$1"
            shift
            local raster_ts sources_ts=0 t
            raster_ts="$(commit_ts "$raster")"
            for src in "$@"; do
              t="$(commit_ts "$src")"
              if (( t > sources_ts )); then sources_ts=$t; fi
            done
            if (( sources_ts > raster_ts )); then
              echo "::warning file=docs/src/assets/${raster}::${raster} looks older than its sources. Run locally: julia --project=docs/src/assets/logo docs/src/assets/logo/draw.jl --png"
            fi
          }
          warn_if_stale logo/logo-static.png logo/draw.jl
          warn_if_stale logo/logo-dark-static.png logo/draw.jl
          warn_if_stale favicon.ico logo/draw.jl
          warn_if_stale social/social-preview-static.png logo/draw.jl social/social-preview-static.svg
