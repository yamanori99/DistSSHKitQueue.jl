name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: jetls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read
  actions: write # julia-actions/cache delete-old-caches

jobs:
  # Queue CI is Julia 1.12 only (Project.toml). Kit also runs JETLS on
  # JULIA_SLOT_JETLS_MAX (~1.13); that slot machinery stays in DistSSHKit.
  jetls:
    name: JETLS - 1.12 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      # JETLS's check@release still pins setup-julia@v2 (Node 20). Install locally.
      - name: Install jetls
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.Apps.add(; url="https://github.com/aviatesk/JETLS.jl", rev="release")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: JETLS
        run: ./.github/jetls-check.sh --progress=none
